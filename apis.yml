name: ChemConnect
description: ChemConnect, Inc. was a Houston, Texas-based electronic exchange (founded 1995) for trading
  midstream energy, feedstocks, chemicals, and related commodities such as natural gas liquids, refined
  and intermediate fuels, aromatics, olefins, and commodity polymers, serving thousands of member
  companies with e-commerce, market information, negotiation, and supply-chain collaboration tooling. It
  acquired rival CheMatch to form a leading commodity trading platform. The company is a now-exited
  Battery Ventures portfolio investment; it no longer operates and the chemconnect.com domain is parked
  and listed for sale (HugeDomains), so there is no live developer, API, or documentation surface to
  enrich.
